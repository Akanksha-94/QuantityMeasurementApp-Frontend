<div class="errors-history-container">
  <h2>Error History</h2>

  <div *ngIf="loading" class="loading">Loading...</div>
  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

  <div *ngIf="!loading && !errorMessage" class="history-list">
    <div *ngIf="history.length === 0" class="empty">No error history found.</div>
    <div *ngFor="let item of history" class="history-item">
      <p><strong>Operation:</strong> {{ item.operation }}</p>
      <p><strong>Error:</strong> {{ item.errorMessage }}</p>
      <p><strong>Created:</strong> {{ item.createdAt | date:'medium' }}</p>
    </div>
  </div>
</div>
